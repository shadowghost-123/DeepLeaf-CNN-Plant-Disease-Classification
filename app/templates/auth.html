{% extends "base.html" %}
{% block content %}
<div class="auth-card mx-auto p-4 p-md-5">
  <div class="auth-header mb-4">
    <p class="eyebrow mb-2">ACCOUNT</p>
    <h2>{{ title }}</h2>
    <p class="text-muted mb-0">Private, simple plant health records.</p>
  </div>

  <form method="post" class="auth-form">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" class="form-control" type="email" name="email" required>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input id="password" class="form-control" type="password" name="password" minlength="8" required>
    </div>

    <button class="btn btn-leaf w-100 btn-lg">{{ title }}</button>
  </form>

  <p class="mt-3 small auth-switch">
    {% if register %}
      Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>
    {% else %}
      New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
    {% endif %}
  </p>
</div>
{% endblock %}
